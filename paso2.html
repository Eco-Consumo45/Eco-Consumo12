<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Eco Consumo - Paso 2 de 2</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"> 
<link rel="preconnect" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" crossorigin>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="style2.css">
</head>
<body>
  <main class="pantalla">

    <header class="marca">
      <span class="marca__logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#1b4332" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 19C5 10 10 4 19 4c0 9-5 15-14 15z" fill="#f4f7f2"/>
          <path d="M5 19c3-5 6-8 10-10M11 13l-1-4M13 11l3 0"/>
        </svg>
      </span>
      <span class="marca__nombre">Eco Consumo</span>
    </header>

    <p class="paso">Paso 2 de 2</p>

    <h1 class="titulo">Contanos<br>sobre vos</h1>

    <p class="bajada">Como segundo paso, completá tus datos.</p>

    <form class="formulario" action="#" method="post">

      <div class="fila">
        <div class="campo">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" autocomplete="given-name" required>
        </div>
        <div class="campo">
          <label for="apellido">Apellido</label>
          <input type="text" id="apellido" name="apellido" autocomplete="family-name" required>
        </div>
      </div>

      <div class="campo campo--fecha">
        <label for="nacimiento">Fecha de nacimiento</label>
        <input type="text" id="nacimiento" name="nacimiento" placeholder="DD/MM/AA"
               inputmode="numeric" autocomplete="bday"
               pattern="(0[1-9]|[12][0-9]|3[01])/(0[1-9]|1[0-2])/[0-9]{2}" required>
      </div>

      <div class="campo campo--mail">
        <label for="mail">Mail</label>
        <input type="email" id="mail" name="mail" placeholder="tumail@gmail.com" autocomplete="email" required>
      </div>

      <div class="campo campo--usuario">
        <label for="usuario">Crea tu nombre de usuario</label>
        <input type="text" id="usuario" name="usuario" autocomplete="username" required>
      </div>

      <div class="campo campo--clave">
        <label for="clave">Crea una contraseña</label>
        <input type="password" id="clave" name="clave" autocomplete="new-password"
               pattern="(?=.*[0-9])(?=.*[A-Z]).+"
               title="Al menos 1 número y 1 mayúscula" required>
      </div>

      <p class="ayuda">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
          <path fill="#000" d="M7 14a5 5 0 1 1 4.6-7H21v3h-2v2h-3v-2h-4.4A5 5 0 0 1 7 14zm0-7.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z" transform="rotate(-45 12 12) translate(2 2)"/>
        </svg>
        Contraseña segura: 1 número (mínimo) y 1 mayúscula (mínimo).
      </p>

      <div class="campo campo--direccion">
        <label for="direccion">Agrega tu dirección</label>
        <input type="text" id="direccion" name="direccion" autocomplete="street-address" required>
      </div>

      <div class="acciones">
        <button type="submit" class="boton">
          Siguiente
          <svg viewBox="0 0 40 16" width="40" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M1 8h37M31 1l7 7-7 7"/>
          </svg>
        </button>
      </div>

    </form>
  </main>
</body>
</html>

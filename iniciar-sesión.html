<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco Consumo - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column min-vh-100 justify-content-between m-0">

    <header class="w-100 p-4 px-5 d-flex align-items-center">
        <span class="nombre-logo fw-bold fs-3 d-flex align-items-center gap-2 text-verde">
            <i class="bi bi-leaf-fill"></i> Eco Consumo
        </span>
    </header>

    <main class="container my-auto px-4 py-5 app-container text-start">
        <h6 class="text-uppercase text-muted fw-bold fs-5 mb-2">Ingreso</h6>
        <h1 class="titulo mb-3 fw-bold display-4 text-verde">Accedé a tu cuenta</h1>
        
        <p class="lema mb-5 text-muted fs-4">Qué bueno volver a verte.</p>

        <form>
            <div class="mb-4">
                <label for="email" class="form-label text-muted fw-semibold fs-5">Mail o usuario</label>
                <input type="text" class="form-control py-3 px-4 rounded-4 border-success text-center fs-4" id="email" placeholder="colocá tu mail o usuario">
            </div>

            <div class="mb-4">
                <label for="password" class="form-label text-muted fw-semibold fs-5">Contraseña</label>
                <div class="input-group">
                    <input type="password" class="form-control py-3 px-4 rounded-start-4 border-success text-center fs-4" id="password" placeholder="colocá tu contraseña">
                    <button class="btn btn-outline-success px-4 rounded-end-4 border-success" type="button" id="togglePassword">
                        <i class="bi bi-eye fs-4" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <div class="mb-5 text-start">
                <a href="#" class="text-success text-decoration-none fw-semibold fs-5">¿Olvidaste tu contraseña?</a>
            </div>
        </form>

        <div class="d-flex justify-content-between align-items-center gap-4 mt-4">
            <a href="index.html" class="btn btn-outline-secondary w-50 py-3 rounded-pill fw-semibold fs-4 d-flex align-items-center justify-content-center gap-2">
                <i class="bi bi-arrow-left"></i> Atrás
            </a>
            <a href="bienvenida.html" class="btn btn-success w-50 py-3 rounded-pill fw-semibold fs-4 d-flex align-items-center justify-content-center gap-2">
                Siguiente <i class="bi bi-arrow-right"></i>
            </a>
        </div>
    </main>

    <footer class="pie text-center py-4 text-muted">
        <p class="mb-0 fw-semibold text-verde fs-5">Elegí mejor. Reutilizá. Compartí.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#password');
        const eyeIcon = document.querySelector('#eyeIcon');

        togglePassword.addEventListener('click', function () {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            
            eyeIcon.classList.toggle('bi-eye');
            eyeIcon.classList.toggle('bi-eye-slash');
        });
    </script>
</body>
</html>

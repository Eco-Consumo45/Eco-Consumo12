<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco Consumo - ¡Bienvenido!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="estilo.css">
</head>
<body class="d-flex flex-column min-vh-100 justify-content-between m-0">

    <header class="w-100 p-4 px-5 d-flex align-items-center">
        <span class="nombre-logo fw-bold fs-3 d-flex align-items-center gap-2" style="color: #1f4e3d;">
            <i class="bi bi-leaf-fill"></i> Eco Consumo
        </span>
    </header>

    <main class="container my-auto px-4 py-5 app-container text-start">
        <h1 class="titulo mb-3 fw-bold display-4" style="color: #1f4e3d;">¡Qué bueno tenerte de vuelta!</h1>
        
        <p class="lema mb-5 text-muted fs-4">Accediste a tu cuenta correctamente.<br>Te damos la bienvenida de nuevo.</p>

        <div class="my-5 text-center">
            <span class="nombre-logo fw-bold fs-3 d-inline-flex align-items-center gap-2" style="color: #1f4e3d;">
                <i class="bi bi-leaf-fill"></i> Eco Consumo
            </span>
        </div>

        <div class="d-flex justify-content-end mt-4">
            <a href="#" class="btn btn-success px-5 py-3 rounded-pill fw-semibold fs-4 d-inline-flex align-items-center justify-content-center gap-2">
                Siguiente <i class="bi bi-arrow-right"></i>
            </a>
        </div>
    </main>

    <footer class="pie text-center py-4 text-muted">
        <p class="mb-0 fw-semibold fs-5" style="color: #1f4e3d;">Elegí mejor. Reutilizá. Compartí.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>


<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoConsumo - Agregar producto</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="contenedor">

<header class="encabezado">
<a href="../pagina2/index.html" class="volver" aria-label="Volver">
←
</a>

<h1>Agregar producto</h1>

<div class="usuario" aria-label="Perfil de usuario">
♙
</div>
</header>

<form class="formulario">

<section class="imagen-producto">
<label for="foto">Imagen del producto</label>

<label for="foto" class="subir-imagen">
<span class="camara">◎</span>
<span>Toca para subir foto</span>
<small>JPG, PNG - Máx. 5MB</small>
</label>

<input
type="file"
id="foto"
accept="image/png, image/jpeg"
>
</section>

<div class="campo">
<label for="nombre">Nombre de producto</label>
<input
type="text"
id="nombre"
placeholder="Nombre de venta"
required
>
</div>

<div class="campo">
<label for="descripcion">Descripción</label>
<input
type="text"
id="descripcion"
placeholder="Descripción de venta"
required
>
</div>

<div class="campo">
<label for="elaboracion">Fecha de elaboración (Día que se hizo)</label>
<input
type="date"
id="elaboracion"
required
>
</div>

<div class="campo">
<label for="vencimiento">Fecha de vencimiento</label>
<input
type="datetime-local"
id="vencimiento"
required
>
<small class="aviso">⚠ Debe ser posterior a la fecha de elaboración.</small>
</div>

<div class="campo">
<label for="precio">Precio</label>
<input
type="number"
id="precio"
placeholder="$ Precio"
min="1"
required
>
</div>

<div class="campo">
<label for="stock">Cantidad / Stock</label>
<input
type="number"
id="stock"
placeholder="- Stock"
min="1"
required
>
</div>

<button type="submit" class="publicar">
Publicar
</button>

</form>

</main>

</body>
</html>
